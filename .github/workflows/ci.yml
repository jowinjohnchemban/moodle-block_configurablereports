name: ci

on: [push, pull_request]

jobs:
  test:
    uses: catalyst/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    # Publishing to moodle.org is disabled below (disable_release: true), so no secret is
    # needed to run CI. Only the upstream repo that actually publishes releases should
    # uncomment this (and only it will have MOODLE_ORG_TOKEN configured):
    # secrets:
    #   moodle_org_token: ${{ secrets.MOODLE_ORG_TOKEN }}
    with:
      disable_grunt: true
      disable_phpunit: true
      disable_release : true
      release_branches: main
      min_php : 7.4