name: Build plugin zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          RELEASE=$(grep -oP "release\s*=\s*'\K[^']+" version.php)
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Package plugin into configurable_reports/
        run: |
          mkdir -p build/configurable_reports
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            ./ build/configurable_reports/

      - name: Zip plugin
        working-directory: build
        run: zip -r "../configurable_reports-${{ steps.version.outputs.release }}.zip" configurable_reports

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: configurable_reports-${{ steps.version.outputs.release }}
          path: configurable_reports-${{ steps.version.outputs.release }}.zip
          retention-days: 90

      - name: Attach zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: configurable_reports-${{ steps.version.outputs.release }}.zip
